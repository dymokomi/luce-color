name: Correctness
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15, ubuntu-24.04]
    steps:
      - uses: actions/checkout@v7
        with:
          path: luce-color
      - name: Read compiler pins
        id: pins
        run: |
          echo "base=$(cat luce-color/bootstrap/BASE)" >> "$GITHUB_OUTPUT"
          echo "luce=$(cat luce-color/bootstrap/LUCE)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v7
        with:
          repository: dymokomi/luce-base
          ref: ${{ steps.pins.outputs.base }}
          path: luce-base
      - uses: actions/checkout@v7
        with:
          repository: dymokomi/luce
          ref: ${{ steps.pins.outputs.luce }}
          path: luce
      - name: Select Clang
        run: |
          mkdir -p "$RUNNER_TEMP/luce-bin"
          ln -s "$(command -v clang)" "$RUNNER_TEMP/luce-bin/cc"
          echo "$RUNNER_TEMP/luce-bin" >> "$GITHUB_PATH"
      - name: Build native compilers
        run: |
          (cd luce-base && ./build.sh)
          (cd luce && LUCE_BASE_COMPILER=../luce-base/build/luce-base ./build.sh)
      - name: Oklab conversion and derivation tests
        working-directory: luce-color
        run: ./test.sh
